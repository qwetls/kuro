name: Build and Release vmusic APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Signed vmusic Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      KURO_KEYSTORE_BASE64: ${{ secrets.KURO_KEYSTORE_BASE64 }}
      KURO_STORE_PASSWORD: ${{ secrets.KURO_STORE_PASSWORD }}
      KURO_KEY_ALIAS: ${{ secrets.KURO_KEY_ALIAS }}
      KURO_KEY_PASSWORD: ${{ secrets.KURO_KEY_PASSWORD }}
      KURO_KEYSTORE_FILE: ${{ github.workspace }}/app/release.keystore

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Validate signing secrets and decode keystore
        run: |
          test -n "$KURO_KEYSTORE_BASE64" || { echo "Missing KURO_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$KURO_STORE_PASSWORD" || { echo "Missing KURO_STORE_PASSWORD secret"; exit 1; }
          test -n "$KURO_KEY_ALIAS" || { echo "Missing KURO_KEY_ALIAS secret"; exit 1; }
          test -n "$KURO_KEY_PASSWORD" || { echo "Missing KURO_KEY_PASSWORD secret"; exit 1; }
          printf '%s' "$KURO_KEYSTORE_BASE64" | base64 --decode > "$KURO_KEYSTORE_FILE"
          test -s "$KURO_KEYSTORE_FILE"

      - name: Set up Rust Toolchain and Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build vmusic Native Core (Rust)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          cargo ndk -t arm64-v8a -t armeabi-v7a -o app/src/main/jniLibs build --release --manifest-path vmusic-core/Cargo.toml

      - name: Build Release and Debug APKs
        run: ./gradlew assembleRelease assembleDebug --stacktrace || (echo "=== GRADLE BUILD FAILED ===" && exit 1)

      - name: Name APKs with app version
        id: apk
        run: |
          VERSION_NAME=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION_NAME" || { echo "Could not read app versionName"; exit 1; }
          RELEASE_DIR="app/build/outputs/apk/release"
          DEBUG_DIR="app/build/outputs/apk/debug"
          RELEASE_APK="${RELEASE_DIR}/vmusic-v${VERSION_NAME}-release.apk"
          ARM64_APK="${RELEASE_DIR}/vmusic-v${VERSION_NAME}-arm64-v8a.apk"
          ARM32_APK="${RELEASE_DIR}/vmusic-v${VERSION_NAME}-armeabi-v7a.apk"
          DEBUG_APK="${DEBUG_DIR}/vmusic-v${VERSION_NAME}-debug.apk"
          if [ -f "${RELEASE_DIR}/app-universal-release.apk" ]; then
            cp "${RELEASE_DIR}/app-universal-release.apk" "$RELEASE_APK"
          else
            cp "${RELEASE_DIR}/app-release.apk" "$RELEASE_APK"
          fi
          if [ -f "${RELEASE_DIR}/app-arm64-v8a-release.apk" ]; then
            cp "${RELEASE_DIR}/app-arm64-v8a-release.apk" "$ARM64_APK"
          else
            cp "$RELEASE_APK" "$ARM64_APK"
          fi
          if [ -f "${RELEASE_DIR}/app-armeabi-v7a-release.apk" ]; then
            cp "${RELEASE_DIR}/app-armeabi-v7a-release.apk" "$ARM32_APK"
          else
            cp "$RELEASE_APK" "$ARM32_APK"
          fi
          if [ -f "${DEBUG_DIR}/app-universal-debug.apk" ]; then
            cp "${DEBUG_DIR}/app-universal-debug.apk" "$DEBUG_APK"
          else
            cp "${DEBUG_DIR}/app-debug.apk" "$DEBUG_APK"
          fi
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "release_path=$RELEASE_APK" >> "$GITHUB_OUTPUT"
          echo "arm64_path=$ARM64_APK" >> "$GITHUB_OUTPUT"
          echo "arm32_path=$ARM32_APK" >> "$GITHUB_OUTPUT"
          echo "debug_path=$DEBUG_APK" >> "$GITHUB_OUTPUT"

      - name: Generate SHA-256 checksums
        run: |
          sha256sum "${{ steps.apk.outputs.release_path }}" > "${{ steps.apk.outputs.release_path }}.sha256"
          sha256sum "${{ steps.apk.outputs.arm64_path }}" > "${{ steps.apk.outputs.arm64_path }}.sha256"
          sha256sum "${{ steps.apk.outputs.arm32_path }}" > "${{ steps.apk.outputs.arm32_path }}.sha256"
          sha256sum "${{ steps.apk.outputs.debug_path }}" > "${{ steps.apk.outputs.debug_path }}.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.apk.outputs.version }}
          VERSION_NAME: ${{ steps.apk.outputs.version }}
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## vmusic v3.9.13 — Encrypted login cookie & V² logo

          - **Cookie login YouTube terenkripsi**:
            - Cookie login kini disimpan di EncryptedSharedPreferences (Android Keystore), bukan lagi plaintext di penyimpanan app. Migrasi sekali jalan saat pertama dibuka, login aktif tidak terganggu dan tidak perlu login ulang. Logout ikut membersihkan penyimpanan terenkripsi; kalau Keystore perangkat gagal, app kembali ke cara lama tanpa crash.
          - **Logo V² baru sebagai ikon launcher**:
            - Ikon launcher kini memakai mark V² (Dua V, satu pengalaman) — pita putih dan violet dari brand board, dengan background hitam. Varian monochrome untuk themed icon ikut memakai mark yang sama. Ikon notifikasi masih memakai mark lama.
          - **Badge V-Spatial di bawah foto sampul**:
            - Logo dan nama V-Spatial kini tampil di tengah, tepat di bawah foto sampul di full player, seperti badge Dolby Atmos di Apple Music. Badge hanya muncul saat V-Spatial sedang nyala; diketuk untuk membuka Settings efek suara. Pill di baris aksi tetap seperti semula.
          - **Repo resmi pindah ke qwetls/vmusic**:
            - URL self-update di dalam app, halaman rilis, dan link README kini mengarah langsung ke repo baru `qwetls/vmusic` (sebelumnya `qwetls/kuro`, yang kini dialihkan).
          - **Profil selera (Taste Profile)**:
            - App kini belajar dari yang kamu putar dan like: play count per lagu dan artis, like bernilai bobot berat. Seed radio Quick Picks diambil dari lagu teratas profilmu, dan rak baru "Because You Liked" muncul di home. Tanpa data, semua berjalan seperti dulu.
          - **Notifikasi versi baru**:
            - Kalau cek update menemukan rilis lebih baru, app menampilkan notifikasi lokal "vmusic vX.Y.Z tersedia" (sekali per versi). Ketuk notifikasinya untuk membuka dialog update. Tidak ada notifikasi kalau sudah versi terbaru atau cek gagal.
          - **V-Spatial — efek suara ala Dolby Atmos**:
            - Equalizer 5 band, bass boost, virtualizer, dan loudness enhancer bawaan Android, dengan preset V-Spatial, Bass, Vokal, Treble, dan Datar, plus kontrol manual dan tombol on/off. Logo V-Spatial baru di Settings dan player. (Bukan Dolby Atmos sungguhan — itu teknologi berlisensi; ini efek pelebar suara yang meniru rasanya.)
          - **Deteksi sesi login habis**:
            - App kini mendeteksi cookie YouTube yang sudah kedaluwarsa dan menampilkan banner "Sesi login habis" dengan tombol "Login lagi", bukan diam-diam menampilkan library kosong. Error jaringan tidak pernah salah menandai sesi sebagai habis.
          - **Cadangan otomatis library**:
            - Setiap penyimpanan favorites, playlist, riwayat, dan indeks offline kini menyimpan salinan cadangan; kalau data utama rusak, app memulihkannya otomatis dari cadangan. Penghapusan yang disengaja tetap dihormati.
          - **Fallback InnerTube & sleep timer di service**:
            - Kalau client WEB_REMIX gagal, request dibaca ulang lewat client ANDROID_MUSIC sebelum menyerah. Sleep timer kini hidup di PlaybackService, jadi tetap berjalan walau app di-swipe dari recent apps.
          - **Self-update terverifikasi SHA-256**:
            - Setiap APK rilis kini disertai file `.sha256`; UpdateManager hanya memasang APK yang hash-nya cocok persis, dan menghapus unduhan yang gagal verifikasi. (Perlindungan ini berlaku mulai rilis ini; update dari v3.9.9 masih lewat jalur lama.)
          - **Speed Dial ala YouTube Music**:
            - Grid 3x3 kini selebar layar dengan tile persegi seukuran YT Music, sudut lebih bulat, dan judul sedikit lebih besar.
          - **Offline Audio & Thumbnails**:
            - Wrapped ExoPlayer cache data source with `DefaultDataSource.Factory` so local `file://` and `content://` offline audio plays reliably without internet.
            - Downloaded and persisted local offline thumbnails alongside audio, eliminated Coil memory cache clearing on `onStop()`, and preserved MIME type and offline session restore.
          - **Critical UI, Sharing & Release Fixes**:
            - Fixed "Add to Playlist" no-op across Home, Search, Library, and Vibe screens.
            - Fixed all Share buttons (`FLAG_ACTIVITY_NEW_TASK`) and WebView Activity context, restored full-screen lyrics auto-scroll after manual drag, and fixed queue swipe-to-remove index drift.
            - Added missing Mozilla Rhino subpackage R8/ProGuard keep rules and exported `PlaybackService` (`MediaSessionService`) for Android 13–14 media controls.
          - **Data, Lyrics & Rust Native Core**:
            - Fixed lyrics translation cache poisoning, negative-cache handling on network errors, `UiStateCache` collection metadata loss, `UpdateManager` receiver race, and comment posting validation.
            - Hardened Rust JNI exception clearing, relaxed `LiriqoResponse` deserialization, fixed provider ranking and multi-timestamp/offset LRC parsing, and improved duration/thumbnail sanitization.
          - **Performance Optimizations**:
            - Unified all 5 OkHttp clients onto a shared `ConnectionPool` and `Dispatcher` via `HttpClientProvider.baseClient`.
            - Throttled offline download progress emissions, switched playback polling to adaptive intervals (100ms expanded / 500ms collapsed) with active-widget checks, and moved startup disk I/O off the main thread.
          - Published signed release, per-ABI, and debug APKs.
          EOF
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$RELEASE_TAG" \
            "${{ steps.apk.outputs.release_path }}" \
            "${{ steps.apk.outputs.release_path }}.sha256" \
            "${{ steps.apk.outputs.arm64_path }}" \
            "${{ steps.apk.outputs.arm64_path }}.sha256" \
            "${{ steps.apk.outputs.arm32_path }}" \
            "${{ steps.apk.outputs.arm32_path }}.sha256" \
            "${{ steps.apk.outputs.debug_path }}" \
            "${{ steps.apk.outputs.debug_path }}.sha256" \
            --title "vmusic $RELEASE_TAG (Encrypted login cookie & V² logo)" \
            --notes-file RELEASE_NOTES.md \
            --latest

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vmusic-${{ steps.apk.outputs.version }}-APKs
          path: |
            ${{ steps.apk.outputs.release_path }}
            ${{ steps.apk.outputs.release_path }}.sha256
            ${{ steps.apk.outputs.arm64_path }}
            ${{ steps.apk.outputs.arm64_path }}.sha256
            ${{ steps.apk.outputs.arm32_path }}
            ${{ steps.apk.outputs.arm32_path }}.sha256
            ${{ steps.apk.outputs.debug_path }}
            ${{ steps.apk.outputs.debug_path }}.sha256
          retention-days: 30

      - name: Remove temporary signing keystore
        if: always()
        run: rm -f app/release.keystore
